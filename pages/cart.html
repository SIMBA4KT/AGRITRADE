<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Your Order - AgriTrade</title>
    <link rel="stylesheet" href="../css/cart.css">
    <style>
        .auth-gate-form {
            display: none; /* Hidden by default */
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            text-align: left;
        }
        .auth-gate-form input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error-hint { color: #d9534f; font-size: 0.85rem; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="cart-page-container">
    <h1>Review Your Order</h1>
    
    <div id="cart-items-container"></div>

    <div class="cart-summary">
        <div class="total-info">
            <p>Total Amount</p>
            <h3>KES <span id="total-price">0</span></h3>
        </div>

        <!-- INLINE AUTH FORM -->
        <div id="auth-gate" class="auth-gate-form">
            <label style="font-size: 0.9rem; font-weight: bold;">Verify Credentials to Pay:</label>
            <input type="text" id="auth-username" placeholder="Username">
            <input type="password" id="auth-password" placeholder="Password">
            <p id="auth-error" class="error-hint">Invalid credentials. Please try again.</p>
        </div>

        <button id="checkout-btn" class="checkout-btn">Proceed to Payment</button>
    </div>
    
    <div class="navigation-footer">
        <a href="../pages/browseProducts.html" class="back-to-shop-btn">← Continue Shopping</a>
    </div>
</div>

<script src="../js/cart.js"></script>
</body>
</html>
