<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AgriTrade</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <a href="../index.html" style="text-decoration: none; font-size: 0.9rem;">← Back to Home</a>
            <h2>Create an Account 🌱</h2>

            <form id="registerForm">
                <p id="message" style="font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; min-height: 1.2rem;"></p>
                
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                
                <button type="button" onclick="handleAuth('signup')">Register</button>
            </form>

            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
